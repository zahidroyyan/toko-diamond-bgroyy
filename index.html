<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOPUP DIAMOND FF ROYYY</title>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer>
    function app() {
      return {
        adminMode: false,
        originalList: [],
        diamondList: [
          { id: 1, jumlah: '70 Diamond', harga: 'Rp 10.000' },
          { id: 2, jumlah: '140 Diamond', harga: 'Rp 18.000' },
          { id: 3, jumlah: '355 Diamond', harga: 'Rp 45.000' },
        ],
        newDiamond: { jumlah: '', harga: '' },
        login() {
          const pass = prompt("Masukkan kata sandi admin:");
          if (pass === 'zahid201006') {
            this.adminMode = true;
            this.originalList = JSON.parse(JSON.stringify(this.diamondList));
          } else {
            alert('Kata sandi salah');
          }
        },
        tambahDiamond() {
          if (this.newDiamond.jumlah.trim() && this.newDiamond.harga.trim()) {
            const newId = Date.now();
            this.diamondList.push({ id: newId, jumlah: this.newDiamond.jumlah, harga: this.newDiamond.harga });
            this.newDiamond = { jumlah: '', harga: '' };
          } else {
            alert('Mohon isi semua kolom.');
          }
        },
        hapusDiamond(id) {
          this.diamondList = this.diamondList.filter(item => item.id !== id);
        },
        simpanPerubahan() {
          alert('Perubahan berhasil disimpan (hanya sementara di sesi ini).');
          this.originalList = JSON.parse(JSON.stringify(this.diamondList));
        },
        batalPerubahan() {
          this.diamondList = JSON.parse(JSON.stringify(this.originalList));
          this.adminMode = false;
        }
      };
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #c2e9fb, #81a4fd);
    }
  </style>
</head>
<body class="relative min-h-screen text-gray-800" x-data="app()">
  <div class="max-w-3xl mx-auto p-4">
    <h1 class="text-3xl font-extrabold text-center text-blue-900 mb-8">TOPUP DIAMOND FF ROYYY</h1><!-- Ikon Admin Kecil di Pojok Kanan -->
<div class="fixed top-4 right-4 z-50 cursor-pointer" @click="login">
  <img src="https://cdn-icons-png.flaticon.com/512/1828/1828490.png" alt="Admin" class="w-6 h-6">
</div>

<!-- Daftar Diamond -->
<div class="grid md:grid-cols-2 gap-4 mb-6">
  <template x-for="(item, index) in diamondList" :key="item.id">
    <div class="bg-white p-4 rounded-2xl shadow-lg border border-blue-200">
      <div class="flex items-center space-x-4">
        <img src="https://cdn-icons-png.flaticon.com/512/10541/10541798.png" alt="Diamond" class="w-12 h-12">
        <template x-if="adminMode">
          <div class="flex flex-col w-full">
            <input type="text" x-model="item.jumlah" class="border p-1 rounded w-full mb-1">
            <input type="text" x-model="item.harga" class="border p-1 rounded w-full">
          </div>
        </template>
        <template x-if="!adminMode">
          <div>
            <div class="text-blue-900 font-bold text-lg" x-text="item.jumlah"></div>
            <div class="text-sm text-gray-700" x-text="item.harga"></div>
          </div>
        </template>
      </div>
      <template x-if="adminMode">
        <button @click="hapusDiamond(item.id)" class="mt-3 bg-red-500 text-white px-3 py-1 rounded text-sm">Hapus</button>
      </template>
    </div>
  </template>
</div>

<!-- Form Tambah Diamond (Admin) -->
<div x-show="adminMode" class="bg-white p-4 rounded-xl shadow-lg mb-6 border border-green-300">
  <h2 class="text-xl font-semibold mb-3 text-green-700">Tambah Diamond Baru</h2>
  <input x-model="newDiamond.jumlah" type="text" placeholder="Contoh: 500 Diamond" class="p-2 border rounded w-full mb-2">
  <input x-model="newDiamond.harga" type="text" placeholder="Contoh: Rp 65.000" class="p-2 border rounded w-full mb-3">
  <button @click="tambahDiamond" class="bg-green-600 text-white px-4 py-2 rounded w-full hover:bg-green-700 mb-3">Tambah</button>
  <div class="flex space-x-2">
    <button @click="simpanPerubahan" class="bg-blue-700 text-white px-4 py-2 rounded w-full hover:bg-blue-800">Simpan Perubahan</button>
    <button @click="batalPerubahan" class="bg-gray-400 text-white px-4 py-2 rounded w-full hover:bg-gray-500">Kembali ke Pelanggan</button>
  </div>
</div>

<!-- Form Pembelian (Pelanggan) -->
<div x-show="!adminMode" class="bg-white p-4 rounded-xl shadow-lg border border-blue-300">
  <h2 class="text-lg font-bold mb-2">Isi Form Pembelian</h2>
  <input type="text" placeholder="Masukkan ID Free Fire" class="p-2 border rounded w-full mb-2">
  <select class="p-2 border rounded w-full mb-2">
    <option>DANA</option>
    <option>Pulsa</option>
    <option>QRIS</option>
  </select>
  <a href="https://wa.me/6282278960050" target="_blank">
    <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded w-full font-semibold">Beli via WhatsApp</button>
  </a>
</div>

  </div>
</body>
</html>
