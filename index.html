<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOPUP DIAMOND FF ROYYY</title>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer>
    function app() {
      return {
        adminMode: false,
        password: '',
        diamondList: [
          { id: 1, jumlah: '70 Diamond', harga: 'Rp 10.000' },
          { id: 2, jumlah: '140 Diamond', harga: 'Rp 18.000' },
          { id: 3, jumlah: '355 Diamond', harga: 'Rp 45.000' },
        ],
        newDiamond: { jumlah: '', harga: '' },
        login() {
          const pass = prompt("Masukkan kata sandi admin:");
          if (pass === 'zahid201006') {
            this.adminMode = true;
          } else {
            alert('Kata sandi salah');
          }
        },
        tambahDiamond() {
          const newId = Date.now();
          this.diamondList.push({ id: newId, ...this.newDiamond });
          this.newDiamond = { jumlah: '', harga: '' };
        },
        hapusDiamond(id) {
          this.diamondList = this.diamondList.filter(item => item.id !== id);
        }
      };
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-blue-100 relative" x-data="app()">
  <div class="max-w-3xl mx-auto p-4">
    <h1 class="text-2xl font-bold text-center text-blue-900 mb-6">TOPUP DIAMOND FF ROYYY</h1><!-- Ikon Admin Kecil di Pojok Kanan -->
<div class="fixed top-4 right-4 z-50 cursor-pointer" @click="login">
  <img src="https://cdn-icons-png.flaticon.com/512/1828/1828490.png" alt="Admin" class="w-6 h-6">
</div>

<!-- Daftar Diamond -->
<div class="grid gap-4 mb-6">
  <template x-for="(item, index) in diamondList" :key="item.id">
    <div class="bg-white p-4 rounded shadow">
      <div class="flex items-center space-x-2">
        <img src="https://cdn-icons-png.flaticon.com/512/2989/2989989.png" alt="Diamond" class="w-10 h-10">
        <template x-if="adminMode">
          <div class="flex flex-col w-full">
            <input type="text" x-model="item.jumlah" class="border p-1 rounded w-full mb-1">
            <input type="text" x-model="item.harga" class="border p-1 rounded w-full">
          </div>
        </template>
        <template x-if="!adminMode">
          <div>
            <div class="text-blue-900 font-semibold" x-text="item.jumlah"></div>
            <div class="text-sm text-gray-600" x-text="item.harga"></div>
          </div>
        </template>
      </div>
      <template x-if="adminMode">
        <button @click="hapusDiamond(item.id)" class="mt-2 bg-red-500 text-white px-2 py-1 rounded text-sm">Hapus</button>
      </template>
    </div>
  </template>
</div>

<!-- Form Tambah Diamond (Admin) -->
<div x-show="adminMode" class="bg-white p-4 rounded shadow mb-6">
  <h2 class="text-lg font-bold mb-2">Tambah Diamond Baru</h2>
  <input x-model="newDiamond.jumlah" type="text" placeholder="Contoh: 500 Diamond" class="p-2 border rounded w-full mb-2">
  <input x-model="newDiamond.harga" type="text" placeholder="Contoh: Rp 65.000" class="p-2 border rounded w-full mb-2">
  <button @click="tambahDiamond" class="bg-green-600 text-white px-4 py-2 rounded w-full">Tambah</button>
</div>

<!-- Form Pembelian (Pelanggan) -->
<div class="bg-white p-4 rounded shadow">
  <h2 class="text-lg font-bold mb-2">Isi Form Pembelian</h2>
  <input type="text" placeholder="Masukkan ID Free Fire" class="p-2 border rounded w-full mb-2">
  <select class="p-2 border rounded w-full mb-2">
    <option>DANA</option>
    <option>Pulsa</option>
    <option>QRIS</option>
  </select>
  <a href="https://wa.me/6281234567890" target="_blank">
    <button class="bg-blue-600 text-white px-4 py-2 rounded w-full">Beli via WhatsApp</button>
  </a>
</div>

  </div>
</body>
</html>
